<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Préstamo de Equipo Médico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <h1 class="text-center mb-4">🏥 Sistema de Préstamo de Equipo Especializado</h1>

    <!-- Barra de información de sesión -->
    <div id="barraSesion" class="card p-3 shadow-sm mb-4 d-none">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <span>Usuario: <strong id="sesionNombre"></strong></span>
          <span class="badge bg-primary ms-2" id="sesionRol"></span>
        </div>
        <button type="button" id="btnCerrarSesion" class="btn btn-outline-danger btn-sm">Cerrar Sesión 🚪</button>
      </div>
    </div>

    <!-- 1. Inicio de Sesión (sessionStorage) -->
    <div id="seccionLogin" class="card p-4 shadow-sm mb-4">
      <h3 class="mb-3">🔐 Inicio de Sesión</h3>
      <form id="formLogin">
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Nombre del Usuario</label>
            <input type="text" id="loginNombre" class="form-control" placeholder="Ej. Carlos Mendoza" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Rol</label>
            <select id="loginRol" class="form-select" required>
              <option value="">Seleccione</option>
              <option value="Jefe de Area">Jefe de Área (Admin)</option>
              <option value="Enfermero/a">Enfermero/a (Usuario)</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-success">Ingresar</button>
      </form>
    </div>

    <!-- 2. Panel Jefe de Área (localStorage: inventarioEquipos) -->
    <div id="panelJefe" class="d-none">
      <!-- Formulario para agregar equipo -->
      <div class="card p-4 shadow-sm mb-4">
        <h3 class="mb-3">➕ Registrar Nuevo Equipo Médico</h3>
        <form id="formEquipo">
          <div class="row mb-3">
            <div class="col-md-12">
              <label class="form-label">Nombre del Equipo</label>
              <input type="text" id="nombreEquipo" class="form-control" placeholder="Ej. Desfibrilador A, Electrocardiógrafo B" required>
            </div>
          </div>
          <button type="submit" class="btn btn-success">Registrar Equipo</button>
        </form>
      </div>

      <!-- Inventario de equipos -->
      <h3>📋 Inventario de Equipos</h3>
      <div id="listaInventario" class="mt-3 mb-4"></div>

      <!-- Préstamos activos en el hospital -->
      <h3>📑 Control de Préstamos Activos</h3>
      <div id="listaPrestamosJefe" class="mt-3"></div>
    </div>

    <!-- 3. Panel de Enfermero/a (localStorage: inventarioEquipos y prestamosActivos) -->
    <div id="panelEnfermero" class="d-none">
      <!-- Equipos disponibles para préstamo -->
      <h3>📦 Equipos Disponibles</h3>
      <div id="listaDisponibles" class="mt-3 mb-4"></div>

      <!-- Préstamos activos y devolución -->
      <h3>🔄 Préstamos Activos</h3>
      <div id="listaPrestamosEnfermero" class="mt-3"></div>
    </div>

  </div>

  <script src="js/miScript.js"></script>
</body>
</html>
